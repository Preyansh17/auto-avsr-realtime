# Nemotron (nvidia/nemotron-speech-streaming-en-0.6b) best config found so far,
# on the audited three-domain split (patient_legal298_legacy96_split_v1,
# split_audit.json, seed=7). Trained once on `merged`; evaluated cross-domain
# on legal and legacy without retraining. See
# results/nemotron_splitv1_epoch_sweep_2026-07-18.md for the full writeup,
# epoch sweep, and open items. New best (2026-07-24): epochs=210 + speed
# perturbation, 10.76% median merged WER -- beats plain epochs=210 (11.21%)
# on all 3 seeds individually, not just in aggregate. NOT YET given the full
# cross-domain/streaming/beam battery that plain epochs=210 got -- see
# `results` below and `known_gaps`.
#
# This file documents the recipe for humans; it is not consumed by
# nemotron_finetune.py directly (no YAML config loader exists for Nemotron in
# this repo -- everything is CLI args / sbatch env vars). Use
# slurm/nemotron_splitv1_best.sh to actually reproduce this run.

data:
  split: patient_legal298_legacy96_split_v1
  domain_trained_on: merged      # train314 / val40 / test40
  domains_evaluated: [merged]    # legal/legacy cross-domain eval not yet run for the speed-perturb config
  root_dir: /scratch/th3482/LipVideoData/patient_legal298_legacy96_split_v1
  # Split's own label CSVs (labels/{domain}/{train,val,test}.csv) carry
  # unigram5000 token ids -- retokenize to the 1023-piece SPM vocab first via
  # scripts/regenerate_patient_labels.py before use.

model:
  base_checkpoint: nvidia/nemotron-speech-streaming-en-0.6b
  finetune_mode: full            # unfreeze_encoder_layers=-1, train_decoder=1 (encoder+decoder+joint all trainable)

optim:
  learning_rate: 1e-4            # flat, single LR for the whole model -- no decoder/joint differential tried here
  weight_decay: 1e-3             # script default, never swept on this split
  warmup_steps: 200              # script default, never swept on this split
  batch_size: 2
  grad_accum: 2                  # effective batch 4
  precision: bf16-mixed
  epochs: 210                    # swept 90/120/150/180/210/240, 210 chosen as the practical stopping point (see writeup)

augmentation:
  specaugment: true               # default on; not ablated on this split
  speed_perturb: true             # new 2026-07-24; wires NeMo's native train_ds.perturb_speed (Lhotse dataloader config field)

results:
  # offline greedy, 3-seed, epochs=210 + speed perturbation, merged only --
  # cross-domain/streaming/beam battery not yet run for this config.
  epochs_210_speedperturb:
    merged_wer_median: 10.76%
    merged_wer_mean: 10.61%
    per_seed_wer: [11.21%, 9.87%, 10.76%]
    training_cost: "~2x slower than non-perturbed (per-sample resampling); each seed needed 2-3 checkpoint-resume rescues from cluster auto-cancellation"

  # streaming (greedy -- the only decode strategy that works in NeMo's
  # cache-aware carried-state loop; beam is confirmed unimplemented there),
  # 3-seed median, epochs=210 checkpoint (no speed perturbation), fully cross-domain characterized.
  epochs_210_streaming:
    merged_wer: 11.21%
    legal_wer: 8.20%     # best cross-domain number in this whole investigation
    legacy_wer: 25.00%   # worst of 120/180/210 -- legacy monotonically worsens with more epochs
    ttft_from_speech_seconds: ~1.0-1.03    # excludes leading silence
    word_commit_lag_seconds: ~0.92-0.95

  # alternative: better on legacy specifically, at the cost of merged/legal.
  epochs_180_streaming:
    merged_wer: 12.11%
    legal_wer: 9.84%
    legacy_wer: 22.50%
    ttft_from_speech_seconds: ~0.9-1.0
    word_commit_lag_seconds: ~0.85-0.91

known_gaps:
  - "epochs=210 + speed perturbation (10.76% median) has no cross-domain/streaming/beam battery yet -- only merged offline WER confirmed. Treat as best-known merged config, not yet as an overall replacement for plain epochs=210 in cross-domain or latency contexts."
  - "a differential decoder/joint LR recipe (base ~2.5e-5, decoder/joint at x0.2, wd=0.01, ~70 epochs) was surfaced from outside this repo and never implemented/compared -- nemotron_finetune.py has no per-module LR support currently"
  - "legacy WER is split-dependent (13.5% ad-hoc vs 20.0-25.0% here) and monotonically worsens as epoch count increases (120->180->210: 20.0%->22.5%->25.0%) -- unexplained, root cause not investigated; unknown whether speed perturbation changes this"
  - "epochs=240 ties/marginally beats plain epochs=210 on merged WER but was never given the full cross-domain/streaming/beam battery -- 210 was chosen on cost/risk grounds, not because 240 was shown worse"
  - "nemotron_finetune.py gained --resume-ckpt (2026-07-22) and --speed-perturb (2026-07-24) flags -- see writeup's Checkpoint resume section for a caveat on SaveBestWER's best-tracking resetting on resume"
