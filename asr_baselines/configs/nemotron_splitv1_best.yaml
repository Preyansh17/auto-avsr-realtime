# Nemotron (nvidia/nemotron-speech-streaming-en-0.6b) best config found so far,
# on the audited three-domain split (patient_legal298_legacy96_split_v1,
# split_audit.json, seed=7). Trained once on `merged`; evaluated cross-domain
# on legal and legacy without retraining. See
# results/nemotron_splitv1_epoch_sweep_2026-07-18.md for the full writeup,
# epoch sweep, and open items. Epoch ceiling: 210/240 did not beat 180 on
# single-seed screens (240 additionally truncated by a cluster
# auto-cancellation, see the writeup) -- 180 is the confirmed stopping point,
# not 3-seed-verified past that.
#
# This file documents the recipe for humans; it is not consumed by
# nemotron_finetune.py directly (no YAML config loader exists for Nemotron in
# this repo -- everything is CLI args / sbatch env vars). Use
# slurm/nemotron_splitv1_best.sh to actually reproduce this run.

data:
  split: patient_legal298_legacy96_split_v1
  domain_trained_on: merged      # train314 / val40 / test40
  domains_evaluated: [merged, legal, legacy]  # legal/legacy are cross-domain, zero extra training
  root_dir: /scratch/th3482/LipVideoData/patient_legal298_legacy96_split_v1
  # Split's own label CSVs (labels/{domain}/{train,val,test}.csv) carry
  # unigram5000 token ids -- retokenize to the 1023-piece SPM vocab first via
  # scripts/regenerate_patient_labels.py before use.

model:
  base_checkpoint: nvidia/nemotron-speech-streaming-en-0.6b
  finetune_mode: full            # unfreeze_encoder_layers=-1, train_decoder=1 (encoder+decoder+joint all trainable)

optim:
  learning_rate: 1e-4            # flat, single LR for the whole model -- no decoder/joint differential tried here
  weight_decay: 1e-3             # script default, never swept on this split
  warmup_steps: 200              # script default, never swept on this split
  batch_size: 2
  grad_accum: 2                  # effective batch 4
  precision: bf16-mixed
  epochs: 180                    # confirmed best; swept 90/120/150/180/210/240, 210/240 didn't beat it (see writeup)

augmentation:
  specaugment: true               # default on; not ablated on this split

results:
  # streaming (greedy -- the only decode strategy that works in NeMo's
  # cache-aware carried-state loop; beam is confirmed unimplemented there),
  # 3-seed median, epochs=180 checkpoint, fully cross-domain characterized.
  epochs_180_streaming:
    merged_wer: 12.11%
    legal_wer: 9.84%     # best cross-domain number in this whole investigation
    legacy_wer: 22.50%   # the one domain where 180 slightly underperforms 120 (20.00%)
    ttft_from_speech_seconds: ~0.9-1.0     # excludes leading silence
    word_commit_lag_seconds: ~0.85-0.91

known_gaps:
  - "a differential decoder/joint LR recipe (base ~2.5e-5, decoder/joint at x0.2, wd=0.01, ~70 epochs) was surfaced from outside this repo and never implemented/compared -- nemotron_finetune.py has no per-module LR support currently"
  - "legacy WER is split-dependent: 13.5% on the older ad-hoc split vs 20.0-22.5% here, same recipe -- unexplained; also the one domain where more epochs (180 vs 120) made things worse"
  - "epoch sweep stopped at 180 based on single-seed 210/240 screens (240 truncated by cluster cancellation, see writeup) -- not 3-seed-confirmed past 180"
