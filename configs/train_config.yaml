# Training-specific config to avoid fairseq conflicts
defaults:
  - _self_
  - data: default
  - model: default
  - optimizer: adamw
  - trainer: train
  - decode: default

# Hydra settings
hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false

# Training parameters
exp_dir: null
exp_name: null
gpus: null
slurm_job_id: null
file_path: null
ckpt_path: null
pretrained_model_path: null
transfer_frontend: false
transfer_encoder: false

# Optional parameters (can be overridden)
vocab_file: null
beam_size: 40
ctc_weight: 0.1
pre_beam_ratio: 1.5

# LoRA defaults (can be enabled for parameter-efficient finetuning)
lora:
  enabled: false
  r: 8
  alpha: 16
  dropout: 0.05
  scopes: ["encoder", "aux_encoder", "decoder"]
  name_patterns: []
  pattern_scopes: null  # If null, patterns apply to all scopes

# Selective parameter freezing for full finetuning (no LoRA)
# When freeze.enabled=true, specified layers will be FROZEN (not trained)
# All other layers will be trained with full parameters
freeze:
  enabled: false
  scopes: []  # e.g., ["encoder", "aux_encoder"] to freeze encoder and aux_encoder
  name_patterns: []  # e.g., ["encoder\\.encoders\\.(0|1|2|3)\\."] to freeze first 4 conformer blocks
  pattern_scopes: null  # If null, patterns apply to all scopes

# Data limiting for small finetunes
data:
  train_limit_n: null

